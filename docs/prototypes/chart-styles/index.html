<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpaceLens chart styles · prototype</title>
<style>
:root{color-scheme:dark light;font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);color:var(--foreground,#dfe6eb)}
html,body{margin:0}*{box-sizing:border-box}button{font:inherit;font-size:12px;cursor:pointer;color:var(--foreground,#dfe6eb);background:var(--secondary,#26313b);border:1px solid var(--border,#4a5864);border-radius:8px;padding:8px 11px;white-space:nowrap}button:hover{border-color:var(--primary,#4bc4d3)}button:focus-visible{outline:2px solid var(--ring,#61d0df);outline-offset:3px}button[aria-pressed=true]{background:var(--accent,#264c58);border-color:var(--primary,#4bc4d3);color:var(--accent-foreground,#fff)}
.options{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}.modes{display:flex;gap:5px;margin-left:auto}.frame{margin:0}.frame img{display:block;width:100%;height:auto;border-radius:12px}.frame img[hidden]{display:none}.note{font-size:12px;line-height:1.6;color:var(--muted-foreground,#9daebc);margin:10px 0 0}.note strong{color:var(--foreground,#dfe6eb);font-weight:600}.switcher{display:flex;align-items:center;justify-content:center;gap:14px;width:max-content;max-width:100%;position:sticky;bottom:10px;margin:14px auto 4px;padding:8px 10px;border:1px solid var(--border,#4a5864);border-radius:30px;background:var(--popover,#1b252e);box-shadow:0 4px 20px #0003}.switcher button{border-radius:50%;padding:5px;width:30px;height:30px}.switcher output{min-width:115px;text-align:center;font-size:12px;font-weight:600}svg{width:15px;height:15px;vertical-align:middle;stroke:currentColor;stroke-width:1.8;fill:none}@media(max-width:440px){button{font-size:11px;padding:7px 8px}.modes{margin-left:0}.options{gap:5px}}
@media(prefers-color-scheme:light){:root{color:var(--foreground,#18232e)}button{color:var(--foreground,#18232e);background:var(--secondary,#e8edf2);border-color:var(--border,#c5cfd8)}button[aria-pressed=true]{color:var(--accent-foreground,#fff);background:var(--accent,#17677a)}.note{color:var(--muted-foreground,#445464)}.note strong{color:var(--foreground,#18232e)}.switcher{background:var(--popover,#fff);border-color:var(--border,#c5cfd8)}}
</style></head><body><main>
<nav class="options" aria-label="Chart prototype styles"><button type="button" data-choice="aurora" aria-pressed="false">A · Aurora</button>
<button type="button" data-choice="prism" aria-pressed="false">B · Prism</button>
<button type="button" data-choice="contour" aria-pressed="false">C · Contour</button>
<button type="button" data-choice="classic" aria-pressed="false">Original</button><div class="modes" aria-label="Preview appearance"><button type="button" data-mode-choice="dark" aria-pressed="true">Dark</button><button type="button" data-mode-choice="light" aria-pressed="false">Light</button></div></nav>
<figure class="frame"><img data-variant="aurora" data-mode="dark" src="images/aurora-dark.png" alt="Native SpaceLens Aurora chart, dark appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="aurora" data-mode="light" src="images/aurora-light.png" alt="Native SpaceLens Aurora chart, light appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="prism" data-mode="dark" src="images/prism-dark.png" alt="Native SpaceLens Prism chart, dark appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="prism" data-mode="light" src="images/prism-light.png" alt="Native SpaceLens Prism chart, light appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="contour" data-mode="dark" src="images/contour-dark.png" alt="Native SpaceLens Contour chart, dark appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="contour" data-mode="light" src="images/contour-light.png" alt="Native SpaceLens Contour chart, light appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="classic" data-mode="dark" src="images/classic-dark.png" alt="Native SpaceLens Classic chart, dark appearance, invented disk data" width="1620" height="1095" hidden>
<img data-variant="classic" data-mode="light" src="images/classic-light.png" alt="Native SpaceLens Classic chart, light appearance, invented disk data" width="1620" height="1095" hidden></figure>
<p class="note" id="description"></p>
<p class="note">Actual native SwiftUI renders · invented sample data. To hover and drill into folders, run <strong>make chart-preview</strong> on <strong>prototype/storage-map-styles</strong>.</p>
<div class="switcher" aria-label="Cycle prototypes"><button type="button" id="previous" aria-label="Previous style"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg></button><output id="current" aria-live="polite"></output><button type="button" id="next" aria-label="Next style"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg></button></div>
</main><script>
const variants=['aurora','prism','contour','classic'];
const labels={aurora:'A · Aurora',prism:'B · Prism',contour:'C · Contour',classic:'Original · Classic'};
const descriptions={aurora:'<strong>My recommendation.</strong> Soft radial light adds depth; a ranked inspector keeps large folders close. Bloom is the main tradeoff.',prism:'<strong>Sharper and more architectural.</strong> Beveled tiles, a centered chart, and a horizontal legend. More visual detail at small sizes.',contour:'<strong>Quieter and more technical.</strong> Translucent tiles and fine contours, with a directory list on the left. Structure takes priority over filled area.',classic:'<strong>Current baseline.</strong> The existing solid-color rendering, shown with exactly the same sample data.'};
const params=new URLSearchParams(location.search);let variant=variants.includes(params.get('variant'))?params.get('variant'):'aurora';let mode=params.get('appearance')==='light'?'light':'dark';
function render(){document.querySelectorAll('.frame img').forEach(img=>{img.hidden=img.dataset.variant!==variant||img.dataset.mode!==mode});document.querySelectorAll('[data-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.choice===variant)));document.querySelectorAll('[data-mode-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.modeChoice===mode)));document.getElementById('current').textContent=labels[variant];document.getElementById('description').innerHTML=descriptions[variant];try{const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('appearance',mode);history.replaceState({},'',url)}catch{}}
function cycle(offset){variant=variants[(variants.indexOf(variant)+offset+variants.length)%variants.length];render()}
document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{variant=button.dataset.choice;render()}));document.querySelectorAll('[data-mode-choice]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.modeChoice;render()}));document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1)}});render();
</script></body></html>
